name: DeskLink portable Windows + macOS

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install build-time tools (not required on client PCs)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-client.txt "pyinstaller>=6.12,<7"
      - name: Test shared app code
        run: python -m unittest discover -s tests -v
      - name: Package branded portable EXE
        run: python build_standalone.py
      - name: Validate EXE output
        shell: pwsh
        run: |
          if (!(Test-Path dist/DeskLink.exe)) { throw 'DeskLink.exe not created' }
          Get-Item dist/DeskLink.exe | Select-Object Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: DeskLink-Windows-x64
          path: dist/DeskLink.exe
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS ${{ matrix.name }} .app + .dmg
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            name: Intel
            arch: x86_64
          - os: macos-15
            name: Apple-Silicon
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Restore executable permissions for Mac launchers
        shell: bash
        run: |
          chmod +x MAC-*.command mac_run.sh
          ls -l MAC-*.command mac_run.sh
      - name: Install Python + Tk on builder Mac (not client Mac)
        shell: bash
        run: |
          # Some hosted Intel Macs already contain a python3.13 binary at
          # /usr/local/bin. Homebrew may install successfully but fail to link
          # its own symlink. Verify the Homebrew-managed interpreter directly.
          if ! brew install python@3.13 python-tk@3.13; then
            echo '::warning::Homebrew returned an error; checking the Python/Tk files themselves.'
          fi
          PYTHON_BIN="$(brew --prefix python@3.13)/bin/python3.13"
          test -x "$PYTHON_BIN" || { echo '::error::Homebrew Python 3.13 not available'; exit 1; }
          "$PYTHON_BIN" -c 'import tkinter; print("macOS Tk ready")'
          "$PYTHON_BIN" -m venv .build-venv
          .build-venv/bin/python -c 'import tkinter; print("macOS virtual environment Tk ready")'
      - name: Install build-time tools
        shell: bash
        run: |
          .build-venv/bin/python -m pip install --upgrade pip
          .build-venv/bin/python -m pip install -r requirements-client.txt 'pyinstaller>=6.12,<7'
      - name: Test shared app code
        shell: bash
        run: .build-venv/bin/python -m unittest discover -s tests -v
      - name: Package DeskLink.app
        shell: bash
        run: |
          .build-venv/bin/python build_standalone.py
          test -d dist/DeskLink.app
      - name: Create macOS disk image
        shell: bash
        run: |
          hdiutil create -volname DeskLink -srcfolder dist/DeskLink.app -format UDZO -ov "dist/DeskLink-macOS-${{ matrix.arch }}.dmg"
          test -s "dist/DeskLink-macOS-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: DeskLink-macOS-${{ matrix.arch }}
          path: dist/DeskLink-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 30
